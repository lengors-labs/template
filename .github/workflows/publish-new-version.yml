---
name: Publish new version

on:
  push:
    branches:
      - main
      - rc
  # Publishes a preview for a single topic branch. The branch must already be
  # listed in `.releaserc.js`, which is what gives the run its `preview-…`
  # prerelease identifier and `preview` channel.
  workflow_dispatch:

jobs:
  publish-new-version:
    name: Publish new version
    runs-on: ubuntu-latest
    environment: publisher
    # A dispatch is only meaningful on a topic branch; without this guard the
    # dropdown would also offer `main` and `rc`, which already release on push.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      startsWith(github.ref_name, 'feat/') ||
      startsWith(github.ref_name, 'bug/') ||
      startsWith(github.ref_name, 'chore/')
    outputs:
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      - name: Create GitHub app token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        id: checkout
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Never supply GIT_AUTHOR_* or GIT_COMMITTER_*: the API-side commit plugin
      # must let the App token imply the identity for GitHub to sign the commit.
      # This generic template remains tag-only; language templates opt into commits.
      - name: Publish version
        uses: cycjimmy/semantic-release-action@v4
        id: semantic-release
        with:
          # semantic-release bundles none of these, so they are installed here.
          extra_plugins: |
            semantic-release-gitmoji
            @jno21/semantic-release-github-commit@1.0.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # The pinned commit plugin persists its authenticated fetch URL despite
      # checkout's persist-credentials: false. Scrub it even if publishing fails.
      - name: Remove the token from the checkout
        if: always() && steps.checkout.outcome == 'success'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: bash .github/scripts/remove-checkout-token.sh
